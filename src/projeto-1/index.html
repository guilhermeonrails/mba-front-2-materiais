<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Cliques</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Contador de Cliques</h1>
        <p class="valor" id="valor">0</p>
        <p class="mensagem" id="mensagem">Clique em um botão para começar</p>
        <div class="botoes">
            <button class="btn btn-secundario" id="btn-menos">− 1</button>
            <button class="btn" id="btn-mais">+ 1</button>
        </div>
        <button class="btn-link" id="btn-zerar">Zerar contador</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
